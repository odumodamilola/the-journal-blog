name: Verify CMS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://tgfhjjiojftvidofzxji.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_i6d3yastqyjgGhiZDyMs7w_NZamlegB
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3107
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=low
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/performance-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-quality-reports
          path: |
            test-results/
            .audit-reports/
          retention-days: 7
          # The audit directory is intentionally hidden; upload only the two
          # explicit report paths above, including their contents.
          include-hidden-files: true
