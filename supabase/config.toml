project_id = "the-journal-blog"

[auth]
enabled = true
site_url = "https://the-journal-blog-three.vercel.app"
additional_redirect_urls = ["https://the-journal-blog-three.vercel.app/login", "http://localhost:3000/login", "http://localhost:3107/login"]
enable_signup = false
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[storage.vector]
enabled = false
